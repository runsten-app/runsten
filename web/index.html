<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- runsten-web rewrites the base (reverse proxy prefix) and fills the nonce of its CSP. -->
    <base href="/" />
    <meta name="csp-nonce" content="" />
    <!-- viewport-fit=cover: an installed app draws under the home indicator, which the shell
         pads by env(safe-area-inset-*) (AppShell.vue). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <!-- The ICO for the browsers that take no SVG; the SVG follows the browser's scheme. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Added to a home screen: manifest.json for every browser; iOS reads its own meta and
         takes no SVG for the icon. The default status bar keeps the page below it. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Runsten" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)" />
    <title>Runsten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
