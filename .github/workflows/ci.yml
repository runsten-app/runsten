# CI: runs `task ci`, the same pipeline as locally, as its three levels in parallel jobs, by
# what they need: `task unit` (Go or Node alone, as unit-go and unit-web) reports in
# minutes, `task integration` (containers: PostgreSQL, Redocly, Trivy) and `task system`
# (the Compose stack, browser tests included) wait for nothing else, and a failed one is
# re-run alone. unit-go and unit-web run only when their side changed; integration and
# system, which check the whole, always run. Task is the one pinned in tools/go.mod, so every
# job sets Go up.
# Actions are pinned by SHA, kept up to date by Dependabot.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which side a push or a pull request touches (against the commit before the push, or
  # the pull request's base). A skipped job counts as passed for a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # With its credentials: on a push, the filter fetches the commit before it. The job runs
      # nothing of the repository's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts when some pattern matches it and no exclusion does.
          predicate-quantifier: some-with-excludes
          # Go: anything outside the front end, but prose; a new directory is included
          # rather than forgotten (embedded migrations, the catalog, scenarios, testdata).
          # The front end: its own files, and what its types and fixtures come from.
          filters: |
            go:
              - '**'
              - '!web/**'
              - '!**/*.md'
            web:
              - 'web/**'
              - 'api/openapi.yaml'
              - 'internal/api/testdata/**'
              - 'Taskfile.yml'
              - 'tools/**'
              - '.github/workflows/ci.yml'

  unit-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task unit-go

  unit-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go tool -modfile=tools/go.mod task unit-web

  integration:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  system:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Task, and image-platforms reads the architecture of each binary with go version -m.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The browser tests run from web/node_modules, in the pinned Playwright image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go tool -modfile=tools/go.mod task system
      # Screenshots of every view, and the Playwright report (with traces) of a failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results
          path: web/e2e-results
          if-no-files-found: ignore
