name: Car API behavior
description: What a car's API returned, when Runsten reads it wrong or not at all.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The car makers' APIs are little documented: what they really return helps every user.
        Remove the VIN, positions and tokens from the responses before pasting them.
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - Volvo Cars API
        - Polestar Data Portal
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car
      description: Model and model year.
      placeholder: EX30, 2024
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: As stored in the `endpoint` column of the `snapshots` table.
      placeholder: energy-state
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
      description: The JSON, as stored in the `snapshots` table of your instance (its `payload` column).
      render: json
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What the car was doing (parked, driving, charging AC or DC), and what Runsten showed.
