name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove VINs, tokens, API keys, addresses and positions from everything you paste here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: instance
    attributes:
      label: Instance
      description: Where your Runsten runs.
      options:
        - Self-hosted
        - Hosted (my.runsten.app)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Self-hosted only: `RUNSTEN_VERSION` or the image tag, or the commit if you built it."
      placeholder: v0.10.1
  - type: input
    id: car
    attributes:
      label: Car
      description: Make, model and model year, if it matters.
      placeholder: Polestar 2, 2023
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: How the car is read, if it matters.
      options:
        - Volvo Cars API
        - Polestar Data Portal
        - Imports only
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of `docker compose logs runsten-collector` or `runsten-api`.
      render: text
