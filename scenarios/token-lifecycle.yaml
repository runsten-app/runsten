  profile: bev-generic
  model: EX-SIM
  modelYear: 2026
  batteryKWh: 80
  consumptionKWhPer100km: 18
  chargingCurrentLimitA: 16
  soc: 62
  targetSoc: 80
  odometerKm: 12400
  place: home
places:
  home: { lat: 45.7640, lon: 4.8357 }
  work: { lat: 45.7797, lon: 4.9270 }
steps:
  # Day 1
  - park: { duration: 2h }
  - drive: { to: work, distanceKm: 32, duration: 40m }
  - park: { duration: 9h }
  - drive: { to: home, distanceKm: 33, duration: 45m }
  - park: { duration: 13h35m }
  # Day 2
  - drive: { to: work, distanceKm: 32, duration: 40m }
  - park: { duration: 9h }
  - drive: { to: home, distanceKm: 33, duration: 45m }
  - charge: { type: AC, powerKW: 7.4, untilSoc: 80 }
