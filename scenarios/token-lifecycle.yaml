# Token lifecycle over three days of commutes, with an AC charge on the second
# evening. Access tokens last 299 s (the shortest lifetime observed), and the grant
# only 60 hours instead of 6 months: it ends on the third day at 17:00 UTC, during the
# drive home. The collector must refresh on its own until then, then stop polling and
# report that the user has to authorize again.
vin: YV1SMLT0000TL0001
