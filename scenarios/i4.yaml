# The BMW of demonstration: an i4 eDrive40 of 2024, served on BMW CarData (brand bmw),
# read with the simulator's client ID (bmwapi.DevClientID) through the device flow, which
# the simulated owner approves by themselves. Home to work and back, then an AC charge at
# home.
#
# What CarData gives differs from the other sources: the car pushes its changes to an
# MQTT stream (SIM_BMW_STREAM_ADDR), each value with its own timestamp, and the API
# answers the last values only 50 times a day. A value that changes all along a drive or
# a charge (SoC, odometer, position, range) is sent at most every SIM_BMW_SEND_EVERY.
#
# The VIN is fictitious: WBY, the WMI of BMW i, and R, model year 2024, at the tenth
# position. Fictitious coordinates (Brussels).
brand: bmw
vin: WBY31AW02RFR00001
start: 2026-09-28T05:00:00Z
vehicle:
  profile: bev-generic
  model: i4 eDrive40
  modelYear: 2024
  batteryKWh: 83.9
  usableKWh: 80.7
  consumptionKWhPer100km: 16
  chargingCurrentLimitA: 16
  soc: 64
  targetSoc: 80
  odometerKm: 21034
  place: home
places:
  home: { lat: 50.8270, lon: 4.3720 }
  work: { lat: 50.8930, lon: 4.4180 }
steps:
  - park: { duration: 2h }
  - drive: { to: work, distanceKm: 14, duration: 30m }
  - park: { duration: 9h }
  - drive: { to: home, distanceKm: 15, duration: 35m }
  - park: { duration: 1h }
  - charge: { type: AC, powerKW: 11, untilSoc: 80 }
