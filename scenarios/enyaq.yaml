# The Škoda of demonstration: an Enyaq 85 of 2024, served on the MyŠkoda Public API
# (brand skoda), read with the simulator's key (skodaapi.DevAPIKey), the one its owner
# creates in the MyŠkoda app and ticks the car for. Home to work and back, an AC charge at
# home, then a trip on the motorway with a DC charge on the way.
#
# What the API gives differs from the other sources: one endpoint with every part of the
# car's state, each dated from the car's own send, never woken for a read; no ignition
# nor speed (a trip is told by the parking position, IN_MOTION, and the odometer); the
# charging power. The calls are limited per VIN, 20 an hour (SIM_SKODA_PER_HOUR).
#
# The VIN is fictitious: TMB, the WMI of Škoda; J at the fourth position and NY at the
# seventh and eighth, an Enyaq; R, model year 2024, at the tenth. Fictitious coordinates
# (Lyon).
