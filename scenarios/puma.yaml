# The Ford of demonstration: a Puma Gen-E of 2025, served on FordConnect Query (brand
# ford), read with the simulator's application (fordapi.DevApplication), the one its owner
# creates on Ford's developer portal and signs in to Ford with. Home to work and back, an
# AC charge at home, then a trip on the motorway with a DC charge on the way.
#
# What the API gives differs from the other sources: one telemetry with every metric the
# car sent, each dated from its own send, never woken for a read; the ignition tells a
# trip, the charge's status a charge, the charger's voltage and current its power. The
# odometer comes in whole kilometres, the position when the ignition goes off. Two calls
# closer than ten seconds are answered 429 (SIM_FORD_MIN_GAP).
#
# The VIN is fictitious: WF0, the WMI of Ford in Europe. Fictitious coordinates (Lyon).
