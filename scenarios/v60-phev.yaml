# charging power never reported, an 18.819 kWh battery). Its fuel is not simulated yet.
#
# The morning's drive empties the battery: from 2 %, the engine holds it, a point up and
# down (charge sustain). In the afternoon, a short drive in charge mode (16:07 to 16:14),
# between two of the collector's parked readings (16:06 and 16:16 in the derivation's
# test), raises the SoC by about ten points, the cable disconnected: no charge for a
# plug-in hybrid, only the trip the odometer reveals. Then a slow AC charge on a
# household socket.
#
# The engine's charge rate is an assumption (30 kWh per 100 km): Volvo publishes none.
# The VIN is fictitious; the catalog knows no plug-in hybrid yet. Fictitious coordinates
# (Lyon).
