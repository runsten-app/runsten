# The Renault of demonstration: a Renault 5 E-Tech 52 kWh of 2025, served on the My Renault
# app's API (brand renault), read with the account the simulator signs in
# (renaultapi.DevEmail and DevPassword, the one-time code renaultapi.DevCode when
# /sim/renault/tfa has the account ask for it). Home to work and back, an AC charge at
# home, then a trip on the motorway with a DC charge on the way.
#
# What the API gives differs from the other sources: the last state the car sent, dated
# from the car's own clock and never woken for a read; the car sends at each change, and
# every SIM_RENAULT_SEND_EVERY while it drives or charges (unknown on a real one, assumed
# 5 minutes). Kamereon tells no capacity: the model's code R5E1VE, held by the trim, is
# what the catalog is matched on. The calls are limited per account, 60 an hour
# (SIM_RENAULT_PER_HOUR).
#
# The VIN is fictitious: VF1, the WMI of Renault, and S, model year 2025, at the tenth
# position. Fictitious coordinates (Lyon).
brand: renault
vin: VF1RAE0B0S0000001
start: 2026-09-28T05:00:00Z
vehicle:
  profile: bev-generic
  model: Renault 5
  trim: R5E1VE
  modelYear: 2025
  batteryKWh: 52
  usableKWh: 52
  consumptionKWhPer100km: 15
  chargingCurrentLimitA: 16
  soc: 66
  targetSoc: 80
  odometerKm: 6820
  place: home
places:
  home: { lat: 45.7640, lon: 4.8357 }
  work: { lat: 45.7980, lon: 4.8300 }
  station: { lat: 44.5580, lon: 4.7509 }
  coast: { lat: 43.2965, lon: 5.3698 }
steps:
  - park: { duration: 2h }
  - drive: { to: work, distanceKm: 8, duration: 25m }
  - park: { duration: 9h }
  - drive: { to: home, distanceKm: 8, duration: 25m }
  - park: { duration: 1h }
  - charge: { type: AC, powerKW: 11, untilSoc: 90 }
  - park: { duration: 10h }
  - drive: { to: station, distanceKm: 150, duration: 1h40m }
  - charge: { type: DC, powerKW: 80, untilSoc: 85 }
  - drive: { to: coast, distanceKm: 160, duration: 1h50m }
  - park: { duration: 12h }
