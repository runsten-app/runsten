# A Polestar 4 outside the EU/EEA, which the Data Portal does not serve: read through the
# Polestar app's API with the owner's Polestar ID (source polestar_id, ADR 0042), signed in
# as polestaridapi.DevEmail. A Polestar 4 Long Range Single Motor of 2024: a commute, an
# evening AC charge at home, then a DC charge on the way to the lake.
#
# What the API gives is poorer than the Data Portal's: the battery (SoC, range, charging
# or not), the odometer and the service, but no position, no engine and no cable: trips
# come from the odometer, charges from the SoC and the charging status.
#
# The VIN is fictitious: LPS, the WMI of Polestar, and R, model year 2024, at the tenth
# position. Fictitious coordinates (Zürich).
