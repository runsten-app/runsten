components:
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          pattern: Z$
          type: string
        expires_at:
          description: "From then on it no longer authenticates, and stays listed until it is revoked; null: never expires."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        last_used_at:
          description: "The latest request made with it, to the hour; null: never used."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        name:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - id
        - name
        - created_at
        - last_used_at
        - expires_at
      type: object
    AccessTokens:
      additionalProperties: false
      properties:
        items:
          description: Newest first, expired ones included.
          items:
            $ref: "#/components/schemas/AccessToken"
          type: array
      required:
        - items
      type: object
    AccountLimits:
      additionalProperties: false
      properties:
        history_from:
          description: "The trips and charges that ended before it are neither listed nor counted in the statistics: they are kept, and shown again once the limit is lifted. null: none is hidden."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        unavailable:
          description: "The functions the account does not have. costs: the charges' costs, null in the charges and the statistics, and their entry refused (feature_unavailable). stats: the statistics split into intervals, refused (feature_unavailable); a period's totals stay. csv: the trips and charges as CSV files, refused (feature_unavailable); the account's full export stays. mqtt: an MQTT broker, whose setting is refused (feature_unavailable); one set before stays, and nothing is published to it."
          items:
            enum:
              - costs
              - stats
              - csv
              - mqtt
            type: string
          type: array
        unread_vehicles:
          description: "The account's vehicles the collector does not read: what was read of them stays, and is shown, but nothing new is, until the limit is lifted."
          items:
            format: uuid
            type: string
          type: array
      required:
        - history_from
        - unavailable
        - unread_vehicles
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        last4:
          description: "The key's last four characters, to tell it apart: the key itself is never returned."
          type: string
        refused_at:
          description: "When Volvo refused it (regenerated, or its application deleted on the portal): the vehicles are not read until another key. null: not refused."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        set_at:
          description: When it was given.
          format: date-time
          pattern: Z$
          type: string
      required:
        - last4
        - set_at
        - refused_at
      type: object
    ApiKeyUpdate:
      additionalProperties: false
      properties:
        key:
          description: The primary key (vcc-api-key) of an application created on Volvo's developer portal. It is never returned.
          maxLength: 128
          minLength: 16
          pattern: ^[!-~]+$
          type: string
      required:
        - key
      type: object
    Attach:
      additionalProperties: false
      properties:
        charge:
          description: The ID of the charge, which takes the cost from now on.
          examples:
            - "2026-09-28T18:30:00.000000Z"
          type: string
        vehicle:
          description: The ID of the vehicle of the charge.
          type: string
      required:
        - vehicle
        - charge
      type: object
    Battery:
      additionalProperties: false
      properties:
        change:
          description: The evolution of the estimate, from the median of the first 20 estimates. null while the history holds less than 12 months of it or fewer than 40 estimates.
          oneOf:
            - $ref: "#/components/schemas/CapacityChange"
            - type: "null"
        current:
          description: "The median of the latest 20 estimates, all sources together, with their quartiles. null under 5 estimates: not enough points to say anything yet, the series still shows them."
          oneOf:
            - $ref: "#/components/schemas/CapacityQuartiles"
            - type: "null"
        cycles:
          description: "The energy the charges put through the battery over the reference capacity: an estimate too. null without a reference."
          format: double
          type:
            - number
            - "null"
        deviation_pct:
          description: "The current capacity over the reference, minus one, in whole percent: signed and never clamped, so that a bias of the method shows as one instead of passing for a new battery. null when either capacity is."
          format: int64
          type:
            - integer
            - "null"
        estimates:
          description: "The retained estimates, oldest first: one per source and charge."
          items:
            $ref: "#/components/schemas/CapacityEstimate"
          type: array
        excluded:
          $ref: "#/components/schemas/CapacityExcluded"
          description: "The candidates the filters set aside, by reason, in the order of the fields: the reader sees why there are few points."
        months:
          description: The calendar months of the history, empty ones included; [] without an estimate nor a trip.
          items:
            $ref: "#/components/schemas/CapacityMonth"
          type: array
        reference:
          description: The capacity the estimates are compared with and bounded by. null when neither the variant's net capacity nor the vendor's is known, and then no estimate is set aside as implausible, no deviation is shown and no cycles either.
          oneOf:
            - $ref: "#/components/schemas/CapacityReference"
            - type: "null"
        time_zone:
          type: string
      required:
        - time_zone
        - reference
        - current
        - deviation_pct
        - change
        - cycles
        - estimates
        - excluded
        - months
      type: object
    Bounds:
      additionalProperties: false
      properties:
        after:
          format: date-time
          pattern: Z$
          type: string
        before:
          format: date-time
          pattern: Z$
          type: string
      required:
        - after
        - before
      type: object
    BucketStats:
      additionalProperties: false
      properties:
        charges:
          $ref: "#/components/schemas/ChargeStats"
        end:
          description: The end of the interval, excluded.
          format: date-time
          pattern: Z$
          type: string
        parked:
          $ref: "#/components/schemas/ParkedStats"
        start:
          description: The start of the interval, in the requested time zone, written in UTC.
          format: date-time
          pattern: Z$
          type: string
        trips:
          $ref: "#/components/schemas/TripStats"
      required:
        - start
        - end
        - trips
        - charges
        - parked
      type: object
    CapacityChange:
      additionalProperties: false
      properties:
        change_pct:
          description: "The current capacity over the initial one, minus one, in whole percent: signed and never clamped. A ratio of two medians of the same method, in which a constant bias (a charging efficiency, the side of the power) cancels."
          format: int64
          type: integer
        initial_kwh:
          description: The median of the first 20 estimates.
          format: double
          type: number
        since:
          description: "The date of the first estimate: the evolution is measured from the data at hand, not from when the vehicle was new."
          format: date-time
          pattern: Z$
          type: string
      required:
        - since
        - initial_kwh
        - change_pct
      type: object
    CapacityEstimate:
      additionalProperties: false
      properties:
        at:
          description: "When the charge ended at the latest: the date the estimate is plotted at."
          format: date-time
          pattern: Z$
          type: string
        capacity_kwh:
          description: The estimate itself.
          format: double
          type: number
        charge:
          description: The charge the estimate comes from, by its ID (GET /vehicles/{vehicle}/charges/{charge}).
          examples:
            - "2026-09-28T18:30:00.000000Z"
          type: string
        odometer_km:
          description: The charge's odometer, which the estimate is plotted against too; null when no reading of it ended the charge.
          format: double
          type:
            - number
            - "null"
        source:
          description: "power: the integral of the charging power over the charge's retained span, over the SoC change of the same readings. billed: the energy billed for the charge, entered from its receipt, over the SoC change of the whole charge. The two estimates of one charge are two points, never averaged."
          enum:
            - power
            - billed
          type: string
        span_soc:
          description: "The SoC change the estimate divides by, in points: the span's for the power source, the whole charge's for the billed one."
          format: double
          type: number
        type:
          description: The charge's type; null when unknown.
          oneOf:
            - enum:
                - AC
                - DC
              type: string
            - type: "null"
      required:
        - charge
        - at
        - odometer_km
        - source
        - type
        - span_soc
        - capacity_kwh
      type: object
    CapacityExcluded:
      additionalProperties: false
      properties:
        high_soc:
          description: "The charge, or its retained span, reached above the last SoC it keeps (95 %): the power goes into balancing the cells without raising the SoC."
          format: int64
          minimum: 0
          type: integer
        implausible:
          description: "Far from the reference capacity (outside 0.6 to 1.15 times it): a false reading or a recalibration."
          format: int64
          minimum: 0
          type: integer
        low_power:
          description: "A slow charge (under 2 kW on average): its heating and 12 V system weigh in the energy."
          format: int64
          minimum: 0
          type: integer
        no_power:
          description: The vehicle reports no charging power.
          format: int64
          minimum: 0
          type: integer
        power_gap:
          description: "Two of the span's readings are too far apart (more than 3 minutes): a trapezoid invents the power curve."
          format: int64
          minimum: 0
          type: integer
        reconstructed:
          description: "The charge was never seen: neither its power nor its receipt is trustworthy."
          format: int64
          minimum: 0
          type: integer
        span_soc:
          description: "The SoC change is too small (under 20 points): the integer SoC rounds the estimate too much."
          format: int64
          minimum: 0
          type: integer
      required:
        - reconstructed
        - no_power
        - high_soc
        - span_soc
        - power_gap
        - low_power
        - implausible
      type: object
    CapacityMonth:
      additionalProperties: false
      properties:
        capacity:
          description: The estimates that ended in the month; null without one.
          oneOf:
            - $ref: "#/components/schemas/CapacityQuartiles"
            - type: "null"
        end:
          description: The end of the month, excluded.
          format: date-time
          pattern: Z$
          type: string
        range_at_full:
          description: The displayed range at a full charge of the trips that started in the month; null without one.
          oneOf:
            - $ref: "#/components/schemas/RangeAtFull"
            - type: "null"
        start:
          description: The start of the month, in the requested time zone, written in UTC.
          format: date-time
          pattern: Z$
          type: string
      required:
        - start
        - end
        - capacity
        - range_at_full
      type: object
    CapacityQuartiles:
      additionalProperties: false
      properties:
        capacity_kwh:
          description: The median, in kWh.
          format: double
          type: number
        estimates:
          description: How many estimates these figures summarize.
          format: int64
          minimum: 0
          type: integer
        q1_kwh:
          description: The first quartile.
          format: double
          type: number
        q3_kwh:
          description: The third quartile.
          format: double
          type: number
      required:
        - capacity_kwh
        - q1_kwh
        - q3_kwh
        - estimates
      type: object
    CapacityReference:
      additionalProperties: false
      properties:
        capacity_kwh:
          description: The net capacity of the vehicle's variant, or else the capacity the vendor reports.
          exclusiveMinimum: 0
          format: double
          type: number
        source:
          description: "catalog_net: the net capacity of the vehicle's variant in Runsten's catalog, an assumption (the state of charge running from 0 to 100 % over the usable capacity). api: the capacity the vendor reports, when the catalog does not know the variant or its net capacity."
          enum:
            - catalog_net
            - api
          type: string
      required:
        - capacity_kwh
        - source
      type: object
    Charge:
      additionalProperties: false
      properties:
        address:
          description: "The street and town of position, from the instance's reverse geocoder, outside every place. null at a place, without a geocoder, when it knows none, and until it answered: a request made by this read is resolved for a later one."
          type:
            - string
            - "null"
        capacity_kwh:
          description: "The battery capacity the energy estimate rests on, as of the readings that ended the event. null when none was known, and for an event derived before Runsten recorded it: a rebuild of the derived data gives it."
          exclusiveMinimum: 0
          format: double
          type:
            - number
            - "null"
        capacity_source:
          description: "Where capacity_kwh comes from. catalog_net: the net capacity of the vehicle's variant in Runsten's catalog; an assumption, the state of charge running from 0 to 100 % over the usable capacity. api: the capacity the vendor reports, gross as far as the published values tell, when the catalog does not know the variant or its net capacity. null with capacity_kwh."
          oneOf:
            - enum:
                - catalog_net
                - api
              type: string
            - type: "null"
        cost:
          description: "What the charge cost: entered by the user, or else estimated from the tariff of its place. null when unknown: without the account's currency, outside every place without an entered cost, without energy_soc_kwh, or when the tariff has no version for a part of the charge's window."
          oneOf:
            - $ref: "#/components/schemas/Cost"
            - type: "null"
        detected_at:
          description: The first reading that revealed the event.
          format: date-time
          pattern: Z$
          type: string
        end:
          $ref: "#/components/schemas/Bounds"
          description: When the event ended.
        end_soc_pct:
          format: double
          type:
            - number
            - "null"
        energy_power_kwh:
          description: "The other estimate: the charging power integrated over the observed readings. null without observed power readings, as for a reconstructed charge."
          format: double
          type:
            - number
            - "null"
        energy_soc_kwh:
          description: "One of two separate estimates, neither a measurement (the vehicle exposes no energy meter): ΔSoC × capacity_kwh."
          format: double
          type:
            - number
            - "null"
        id:
          description: "Identifies the event for its vehicle: its detection time, to the microsecond. Unlike a row ID, it survives a rebuild of the derived data, as long as the same reading reveals the event. Treat it as opaque."
          examples:
            - "2026-09-28T07:01:00.000000Z"
          type: string
        place:
          description: "The place of the charge: the nearest one whose circle holds its position; without a position, the place that takes such charges, unless the charge is DC. null elsewhere."
          oneOf:
            - $ref: "#/components/schemas/PlaceRef"
            - type: "null"
        position:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
        reconstructed:
          description: "The event was never seen, only revealed by the odometer or the state of charge: it lies somewhere within [start.after, end.before], and start and end are that same interval."
          type: boolean
        start:
          $ref: "#/components/schemas/Bounds"
          description: When the event started. The bounds are never collapsed into a single time.
        start_soc_pct:
          format: double
          type:
            - number
            - "null"
        target_soc_pct:
          format: double
          type:
            - number
            - "null"
        type:
          oneOf:
            - enum:
                - AC
                - DC
              type: string
            - type: "null"
      required:
        - type
        - start_soc_pct
        - end_soc_pct
        - target_soc_pct
        - energy_soc_kwh
        - energy_power_kwh
        - position
        - place
        - address
        - cost
        - id
        - detected_at
        - reconstructed
        - start
        - end
        - capacity_kwh
        - capacity_source
      type: object
    ChargeStats:
      additionalProperties: false
      properties:
        by_type:
          $ref: "#/components/schemas/ChargesByType"
          description: "The same figures by type of charge, but the orphaned costs: they have no type."
        charging_time_s:
          $ref: "#/components/schemas/Span"
          description: The sum of the durations of the observed charges, as driving_time_s.
        charging_time_unknown:
          description: "The charges without a duration: the reconstructed ones."
          format: int64
          minimum: 0
          type: integer
        cost:
          $ref: "#/components/schemas/CostSum"
          description: "The sum of the known costs of the charges, entered ones included: every total their bounds allow lies within [min_minor, max_minor]. {0, 0} over no charge, and without the account's currency."
        cost_entered:
          description: The charges whose cost was entered, counted in cost.
          format: int64
          minimum: 0
          type: integer
        cost_unknown:
          description: "The charges whose cost is unknown, left out of cost: all of them without the account's currency."
          format: int64
          minimum: 0
          type: integer
        count:
          description: The charges that started in the period or interval, reconstructed ones included.
          format: int64
          minimum: 0
          type: integer
        energy_power_kwh:
          description: "The sum of the known integrated power estimates, kept apart from energy_soc_kwh: observed charges only."
          format: double
          type: number
        energy_power_unknown:
          format: int64
          minimum: 0
          type: integer
        energy_soc_kwh:
          description: The sum of the known ΔSoC × battery capacity estimates, reconstructed charges included.
          format: double
          type: number
        energy_soc_unknown:
          format: int64
          minimum: 0
          type: integer
        orphaned_costs:
          $ref: "#/components/schemas/OrphanedCosts"
          description: "The entered costs that no charge takes (GET /charge-costs/orphans) whose window starts in the period or interval, apart: they are in no cost, which would count twice the charge they were entered for, most often detected again with its tariff's cost."
        reconstructed:
          format: int64
          minimum: 0
          type: integer
      required:
        - count
        - reconstructed
        - energy_soc_kwh
        - energy_soc_unknown
        - energy_power_kwh
        - energy_power_unknown
        - charging_time_s
        - charging_time_unknown
        - cost
        - cost_unknown
        - cost_entered
        - orphaned_costs
        - by_type
      type: object
    ChargeTypeStats:
      additionalProperties: false
      properties:
        cost:
          $ref: "#/components/schemas/CostSum"
          description: The sum of the known costs of the charges of this type, as charges.cost.
        cost_entered:
          format: int64
          minimum: 0
          type: integer
        cost_unknown:
          format: int64
          minimum: 0
          type: integer
        count:
          format: int64
          minimum: 0
          type: integer
        energy_soc_kwh:
          format: double
          type: number
        energy_soc_unknown:
          format: int64
          minimum: 0
          type: integer
      required:
        - count
        - energy_soc_kwh
        - energy_soc_unknown
        - cost
        - cost_unknown
        - cost_entered
      type: object
    ChargesByPlace:
      additionalProperties: false
      properties:
        no_position:
          $ref: "#/components/schemas/PlaceStatsFields"
          description: "The charges without a position that no place takes: the DC ones, or all of them without a place marked without_position."
        outside:
          $ref: "#/components/schemas/OutsideCharges"
          description: The charges with a position outside every place, by type.
        places:
          description: The account's places that hold a charge of the period, in the order they were created.
          items:
            $ref: "#/components/schemas/PlaceCharges"
          type: array
      required:
        - places
        - outside
        - no_position
      type: object
    ChargesBySoC:
      additionalProperties: false
      properties:
        end:
          description: The charges by the state of charge they ended at, as start.
          items:
            format: int64
            type: integer
          maxItems: 101
          minItems: 101
          type: array
        left_out:
          description: "The charges in neither: the reconstructed ones, whose states of charge are readings before and after it, and those whose state of charge is unknown at one end."
          format: int64
          minimum: 0
          type: integer
        start:
          description: "The charges by the state of charge they started at: start[20] is those that started at 20 %, rounded to the nearest point."
          items:
            format: int64
            type: integer
          maxItems: 101
          minItems: 101
          type: array
      required:
        - start
        - end
        - left_out
      type: object
    ChargesByType:
      additionalProperties: false
      properties:
        ac:
          $ref: "#/components/schemas/ChargeTypeStats"
        dc:
          $ref: "#/components/schemas/ChargeTypeStats"
        unknown:
          $ref: "#/components/schemas/ChargeTypeStats"
          description: The charges whose type is unknown, as reconstructed ones.
      required:
        - ac
        - dc
        - unknown
      type: object
    Charging:
      additionalProperties: false
      properties:
        cable:
          oneOf:
            - $ref: "#/components/schemas/ReadingCable"
            - type: "null"
        power_w:
          description: Charging power, in W.
          oneOf:
            - $ref: "#/components/schemas/ReadingFloat64"
            - type: "null"
        status:
          description: A charge is in progress when it is charging.
          oneOf:
            - $ref: "#/components/schemas/ReadingChargingStatus"
            - type: "null"
        target_soc_pct:
          description: Target state of charge, in %.
          oneOf:
            - $ref: "#/components/schemas/ReadingFloat64"
            - type: "null"
        type:
          oneOf:
            - $ref: "#/components/schemas/ReadingChargeType"
            - type: "null"
      required:
        - status
        - cable
        - type
        - power_w
        - target_soc_pct
      type: object
    Collection:
      additionalProperties: false
      properties:
        last_failure:
          description: The latest failed call; null when none is known.
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        mode:
          description: "The collector's polling mode, from the latest readings: it reads more often while driving or charging."
          enum:
            - parked
            - driving
            - charging
          type: string
        next_read_at:
          description: When the next call is due, as of passed_at, pauses and quotas included; null when none is, the connection having lost its grant, or having no application key it may read with.
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        passed_at:
          description: "The collector's latest pass over the vehicle, written again at least every minute while it runs: an old one means that it stopped, or cannot reach the database."
          format: date-time
          pattern: Z$
          type: string
        paused_until:
          description: "No call before this, as of passed_at: the vendor limited the rate, or refused the token after a refresh. null when not paused."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        quota:
          description: "The vendor's APIs whose quota is exhausted, as of passed_at, by name: what they give is not read until then. The quota is that of the application key the vehicle is read with: the instance's, which counts every vehicle of the instance, or on an instance without one, the account's own."
          items:
            $ref: "#/components/schemas/Quota"
          type: array
        read_at:
          description: The latest successful call; null when unknown.
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
      required:
        - passed_at
        - mode
        - read_at
        - next_read_at
        - paused_until
        - quota
        - last_failure
      type: object
    Connection:
      additionalProperties: false
      properties:
        api_key:
          description: "The application key the vehicle is read with: instance, the instance's, which reads every vehicle when the instance has one; own, the account's. refused: the account's, refused by Volvo; missing: none, the instance has none either. Neither refused nor missing is read, until the user gives a key (PUT /connection/api-key)."
          enum:
            - instance
            - own
            - refused
            - missing
          type: string
        authorized_at:
          description: When the user authorized the connection; null for a token pasted by hand.
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        reauth_at:
          description: When the grant was found lost; null while active.
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        reauth_reason:
          description: Why the grant was lost; null while active.
          type:
            - string
            - "null"
        refreshed_at:
          description: "When the current refresh token was issued: the collector renews an idle one daily, before it lapses. null without one (a token pasted by hand)."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        status:
          description: "reauth_required once the grant is lost: the vehicle is no longer read until the user connects the Volvo ID again."
          enum:
            - active
            - reauth_required
          type: string
      required:
        - status
        - api_key
        - authorized_at
        - refreshed_at
        - reauth_at
        - reauth_reason
      type: object
    ConnectionSettings:
      additionalProperties: false
      properties:
        api_key:
          description: "The account's own application key; null: none. Not used while instance_key is true."
          oneOf:
            - $ref: "#/components/schemas/ApiKey"
            - type: "null"
        client_id:
          description: "The client ID of the instance's Volvo application (RUNSTEN_VOLVO_CLIENT_ID): the Volvo IDs connect through it, and its secret, never returned, refreshes the tokens."
          type: string
        connected:
          description: A Volvo ID is connected to the account.
          type: boolean
        instance_key:
          description: "The instance's own application key, which reads every vehicle: an account may not give one. null: none, the account's key is required, before connecting a Volvo ID."
          oneOf:
            - $ref: "#/components/schemas/InstanceKey"
            - type: "null"
      required:
        - connected
        - client_id
        - instance_key
        - api_key
      type: object
    Cost:
      additionalProperties: false
      properties:
        currency:
          description: The account's currency, the unit of min_minor and max_minor.
          enum:
            - CHF
            - CZK
            - DKK
            - EUR
            - GBP
            - ISK
            - NOK
            - PLN
            - SEK
            - USD
          type: string
        efficiency:
          description: "For a tariff, the assumed share of the energy drawn from the grid that reaches the battery: the place's, or else the default of the settings (default_efficiency: ac for AC and unknown types, dc for DC). null for an entered cost."
          format: double
          type:
            - number
            - "null"
        energy_kwh:
          description: "The billed energy. For a tariff, an estimate: energy_soc_kwh (itself an estimate) over efficiency. For an entered cost, the energy entered with it, as read on the receipt; null if none was."
          format: double
          type:
            - number
            - "null"
        max_minor:
          description: The highest amount the charge may have cost.
          format: int64
          minimum: 0
          type: integer
        min_minor:
          description: "The lowest amount the charge may have cost, in minor units of the currency (cents): the energy went through somewhere within [start.after, end.before], at prices that may change over it, so every amount the bounds allow lies within [min_minor, max_minor]. Equal to max_minor when the price is the same over the whole window, and for an entered cost."
          format: int64
          minimum: 0
          type: integer
        note:
          description: The note entered with the cost; null for a tariff, and without a note.
          type:
            - string
            - "null"
        source:
          description: "tariff: estimated from the tariff of the charge's place. entered: the amount the user entered for the charge, which replaces the tariff's."
          enum:
            - tariff
            - entered
          type: string
      required:
        - currency
        - min_minor
        - max_minor
        - source
        - energy_kwh
        - efficiency
        - note
      type: object
    CostSum:
      additionalProperties: false
      properties:
        max_minor:
          format: int64
          minimum: 0
          type: integer
        min_minor:
          format: int64
          minimum: 0
          type: integer
      required:
        - min_minor
        - max_minor
      type: object
    CreatedAccessToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          pattern: Z$
          type: string
        expires_at:
          description: "null: never expires."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        last_used_at:
          description: "Always null: it was never used."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        name:
          maxLength: 64
          minLength: 1
          type: string
        token:
          description: "The secret, to send as Authorization: Bearer. Shown this once: only its hash is kept."
          pattern: ^rst_[A-Za-z0-9_-]{43}$
          type: string
      required:
        - token
        - id
        - name
        - created_at
        - last_used_at
        - expires_at
      type: object
    Credentials:
      additionalProperties: false
      properties:
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    Currency:
      additionalProperties: false
      properties:
        code:
          description: ISO 4217.
          enum:
            - CHF
            - CZK
            - DKK
            - EUR
            - GBP
            - ISK
            - NOK
            - PLN
            - SEK
            - USD
          type: string
        minor_digits:
          description: "The digits of the minor unit: amounts in _minor fields are integers of it (cents for EUR, 2)."
          format: int64
          minimum: 0
          type: integer
      required:
        - code
        - minor_digits
      type: object
    DefaultEfficiency:
      additionalProperties: false
      properties:
        ac:
          description: For the AC charges, and those of unknown type.
          format: double
          type: number
        dc:
          description: For the DC charges.
          format: double
          type: number
      required:
        - ac
        - dc
      type: object
    DistanceBand:
      additionalProperties: false
      properties:
        consumption_kwh_per_100km:
          description: An estimate over the band's trips whose energy is known and distance positive, as trips.consumption_kwh_per_100km. null without such a trip.
          format: double
          type:
            - number
            - "null"
        count:
          format: int64
          minimum: 0
          type: integer
        max_km:
          description: And of less than max_km; null for the last band, which has no upper limit.
          format: double
          type:
            - number
            - "null"
        min_km:
          description: The band holds the trips of at least min_km.
          format: double
          minimum: 0
          type: number
      required:
        - min_km
        - max_km
        - count
        - consumption_kwh_per_100km
      type: object
    EnteredCost:
      additionalProperties: false
      properties:
        amount_minor:
          description: "What was paid, in minor units of the account's currency (cents), taxes included. 0 is free: a true zero, not an unknown cost."
          format: int64
          maximum: 1000000000
          minimum: 0
          type: integer
        energy_kwh:
          description: The billed energy, as read on the receipt; null if not known.
          exclusiveMinimum: 0
          format: double
          maximum: 500
          type:
            - number
            - "null"
        note:
          description: Free text, such as the operator or the means of payment, shown to the user only. null or empty for none.
          maxLength: 500
          type:
            - string
            - "null"
      required:
        - amount_minor
        - energy_kwh
        - note
      type: object
    EnteredCostLimits:
      additionalProperties: false
      properties:
        amount_minor_max:
          description: The highest amount_minor accepted; the lowest is 0.
          format: int64
          minimum: 0
          type: integer
        energy_kwh_max:
          description: The highest energy_kwh accepted; it must be above 0.
          format: double
          type: number
        note_chars:
          description: The characters of a note, at most.
          format: int64
          minimum: 0
          type: integer
      required:
        - amount_minor_max
        - energy_kwh_max
        - note_chars
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - error
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          description: Stable and machine-readable.
          enum:
            - invalid_parameter
            - invalid_body
            - unauthorized
            - invalid_credentials
            - cross_origin
            - not_found
            - method_not_allowed
            - unsupported_media_type
            - too_many_attempts
            - currency_in_use
            - without_position_taken
            - too_many_places
            - charge_has_cost
            - api_key_refused
            - instance_key
            - too_many_vehicles
            - feature_unavailable
            - broker_refused
            - insufficient_scope
            - rate_limited
            - internal
          type: string
        message:
          description: For humans; it may change.
          minLength: 1
          type: string
      required:
        - code
        - message
      type: object
    Export:
      additionalProperties: false
      properties:
        exported_at:
          description: When the export was read, from one snapshot of the database.
          format: date-time
          pattern: Z$
          type: string
        format:
          description: Names the document.
          enum:
            - runsten-account
          type: string
        schema:
          description: "The latest migration of the database (as 0013_api_key_last4): the layout of the rows."
          minLength: 1
          type: string
        tables:
          description: Every table that holds the account's data, in a fixed order.
          items:
            $ref: "#/components/schemas/ExportTable"
          type: array
        version:
          description: The layout of this envelope.
          enum:
            - 1
          format: int64
          type: integer
      required:
        - format
        - version
        - schema
        - exported_at
        - tables
      type: object
    ExportTable:
      additionalProperties: false
      properties:
        name:
          description: The table, as accounts, vehicles, snapshots, trips or charges; another schema's is qualified by its name, as an extension of the instance adds them.
          minLength: 1
          type: string
        rows:
          description: Its rows, in a stable order.
          items:
            description: "A row: its columns, by name, as PostgreSQL writes them in JSON (times in UTC), without account_id. Left out: the tokens and the application key of the connections, the password hash, the hashes of the session tokens and of the snapshots."
          type: array
      required:
        - name
        - rows
      type: object
    Failure:
      additionalProperties: false
      properties:
        at:
          format: date-time
          pattern: Z$
          type: string
        endpoint:
          description: The vendor's endpoint called; null when no call could be made, without an access token.
          type:
            - string
            - "null"
        kind:
          description: "quota: the API's quota is exhausted. rate_limited: too many calls, the account is paused. unauthorized: the token was refused again after a refresh. not_found: the vendor does not know the vehicle. unavailable: no response, or a server error. token: no access token could be had, the grant still held (Volvo ID unreachable). key_refused: the application key was refused, not the token. other: another refusal."
          enum:
            - quota
            - rate_limited
            - unauthorized
            - not_found
            - unavailable
            - token
            - key_refused
            - other
          type: string
        status:
          description: The HTTP status; null when the API did not respond.
          format: int64
          type:
            - integer
            - "null"
      required:
        - at
        - endpoint
        - status
        - kind
      type: object
    FigureLevels:
      additionalProperties: false
      properties:
        ac_max_kw:
          enum:
            - manufacturer
            - secondary
          type: string
        ac_option_kw:
          description: null when ac_option_kw is.
          oneOf:
            - enum:
                - manufacturer
                - secondary
              type: string
            - type: "null"
        dc_max_kw:
          enum:
            - manufacturer
            - secondary
          type: string
        gross_kwh:
          enum:
            - manufacturer
            - secondary
          type: string
        net_kwh:
          description: null when net_kwh is.
          oneOf:
            - enum:
                - manufacturer
                - secondary
              type: string
            - type: "null"
      required:
        - gross_kwh
        - net_kwh
        - ac_max_kw
        - ac_option_kw
        - dc_max_kw
      type: object
    InstanceKey:
      additionalProperties: false
      properties:
        last4:
          description: "The last four characters of the instance's key (RUNSTEN_VOLVO_API_KEY), to check it is the one of the application: the key itself is never returned."
          type: string
      required:
        - last4
      type: object
    Limits:
      additionalProperties: false
      properties:
        entered_cost:
          $ref: "#/components/schemas/EnteredCostLimits"
          description: The bounds of the body of PUT /vehicles/{vehicle}/charges/{id}/cost.
        max_power_kw_max:
          description: The highest max_power_kw of a place accepted; it must be above 0.
          format: double
          type: number
        place_name_chars:
          description: The characters of a place's name, at most; it has at least one.
          format: int64
          minimum: 0
          type: integer
        places:
          description: "The places of an account, at most: a safety cap, far above use."
          format: int64
          minimum: 0
          type: integer
        price_per_kwh:
          $ref: "#/components/schemas/PriceLimits"
          description: The bounds of a price per kWh, of a version or a window.
        radius_m:
          $ref: "#/components/schemas/RadiusLimits"
          description: The bounds of a place's radius_m, included.
        versions_per_place:
          description: The versions of a place's tariff, at most; it has at least one.
          format: int64
          minimum: 0
          type: integer
        windows_per_version:
          description: The windows of a version of a tariff, at most.
          format: int64
          minimum: 0
          type: integer
      required:
        - places
        - place_name_chars
        - radius_m
        - max_power_kw_max
        - versions_per_place
        - windows_per_version
        - price_per_kwh
        - entered_cost
      type: object
    Model:
      additionalProperties: false
      properties:
        ac_max_kw:
          description: "The onboard charger the user stated, one of the variant's (its ac_max_kw or ac_option_kw). null when not stated, or when it is not one of the chargers of the variant in effect (ignored): the costs then take the more powerful, an upper bound."
          format: double
          type:
            - number
            - "null"
        family:
          description: The model as the vendor names it (XC40, EX30), without its powertrain or battery; null until the vehicle's details are read.
          type:
            - string
            - "null"
        model_year:
          description: The model year, as the vendor reports it; null until the vehicle's details are read.
          format: int64
          minimum: 1
          type:
            - integer
            - "null"
        variant:
          description: "The variant in effect, from Runsten's catalog: the one the user chose, else the one recognized, the only one that fits the family, model year, battery capacity and VIN the vendor reports. Its figures are the catalog's, from the manufacturer or else from public sources. null when none is chosen and none or several fit, for an unknown family, and for a vehicle that is not battery electric: hybrids are neither recognized nor offered."
          oneOf:
            - $ref: "#/components/schemas/Variant"
            - type: "null"
        variant_source:
          description: "chosen: by the user (PUT /vehicles/{vehicle}/model); detected: recognized from the vehicle's details, recomputed on every read. A chosen variant the catalog no longer has, or of another family than the vehicle reports, is ignored: the recognition applies again. null without a variant."
          oneOf:
            - enum:
                - detected
                - chosen
              type: string
            - type: "null"
      required:
        - family
        - model_year
        - variant
        - variant_source
        - ac_max_kw
      type: object
    ModelYears:
      additionalProperties: false
      properties:
        from:
          format: int64
          minimum: 1
          type: integer
        to:
          description: null while the variant is on sale.
          format: int64
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - from
        - to
      type: object
    MqttBroker:
      additionalProperties: false
      properties:
        client_id:
          description: "The MQTT client identifier; empty: one the collector derives from the account."
          pattern: ^[0-9A-Za-z_-]{0,64}$
          type: string
        discovery:
          description: Home Assistant's discovery messages are published, which create its entities.
          type: boolean
        discovery_prefix:
          description: "Where Home Assistant reads them: homeassistant unless changed in its MQTT integration."
          maxLength: 64
          minLength: 1
          pattern: ^[^/+#]+(/[^/+#]+)*$
          type: string
        password_set:
          description: "The broker has a password: it is never returned."
          type: boolean
        publish_location:
          description: The vehicles' position is published.
          type: boolean
        topic_prefix:
          description: "The topics are under it: <topic_prefix>/vehicles/<vehicle id>/…, and the availability <topic_prefix>/status."
          maxLength: 64
          minLength: 1
          pattern: ^[^/+#]+(/[^/+#]+)*$
          type: string
        updated_at:
          format: date-time
          pattern: Z$
          type: string
        url:
          description: mqtt://host:port, or mqtts://host:port over TLS; the ports default to 1883 and 8883.
          examples:
            - mqtt://homeassistant.local:1883
          maxLength: 255
          type: string
        username:
          description: "Empty: none."
          maxLength: 256
          type: string
      required:
        - url
        - username
        - password_set
        - client_id
        - topic_prefix
        - discovery
        - discovery_prefix
        - publish_location
        - updated_at
      type: object
    MqttBrokerUpdate:
      additionalProperties: false
      properties:
        client_id:
          description: "The MQTT client identifier; empty: one the collector derives from the account."
          pattern: ^[0-9A-Za-z_-]{0,64}$
          type: string
        discovery:
          type: boolean
        discovery_prefix:
          examples:
            - homeassistant
          maxLength: 64
          minLength: 1
          pattern: ^[^/+#]+(/[^/+#]+)*$
          type: string
        password:
          description: "Never returned. null: the stored one is kept, unless the host changes; empty: none."
          maxLength: 256
          type:
            - string
            - "null"
        publish_location:
          type: boolean
        topic_prefix:
          description: runsten, unless several instances publish to one broker.
          maxLength: 64
          minLength: 1
          pattern: ^[^/+#]+(/[^/+#]+)*$
          type: string
        url:
          description: mqtt://host:port, or mqtts://host:port over TLS; the ports default to 1883 and 8883. Neither a path, nor a query, nor credentials.
          maxLength: 255
          minLength: 1
          type: string
        username:
          description: "Empty: none."
          maxLength: 256
          type: string
      required:
        - url
        - username
        - password
        - client_id
        - topic_prefix
        - discovery
        - discovery_prefix
        - publish_location
      type: object
    MqttSettings:
      additionalProperties: false
      properties:
        broker:
          description: "null: none, nothing is published."
          oneOf:
            - $ref: "#/components/schemas/MqttBroker"
            - type: "null"
        public_only:
          description: "The instance publishes to brokers on the Internet only, over TLS (mqtts://): a broker on a local network must be exposed to it."
          type: boolean
        status:
          description: "The collector's connection to the broker; null: no broker."
          oneOf:
            - $ref: "#/components/schemas/MqttStatus"
            - type: "null"
      required:
