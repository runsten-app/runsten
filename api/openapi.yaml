          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        failed_at:
          description: "Its latest failure, to connect or to publish: the connection is down when it is after connected_at. null: none."
          format: date-time
          pattern: Z$
          type:
            - string
            - "null"
        failure:
          description: "The kind of that failure, never the broker's message. unreachable: no connection to the host. refused_address: the instance does not publish to the host's address. tls: the TLS handshake failed (a certificate not trusted, or not for the host). not_authorized: the broker refused the username or the password. rejected: the broker refused the connection otherwise (the client identifier, the protocol). null: none."
          oneOf:
            - enum:
                - unreachable
                - refused_address
                - tls
                - not_authorized
                - rejected
              type: string
            - type: "null"
      required:
        - connected_at
        - failed_at
        - failure
      type: object
