        vehicle_reported:
          $ref: "#/components/schemas/VehicleTrip"
          description: "The vehicle's own trip figures, for comparison only: their exact semantics are unknown, and a reconstructed trip has none."
      required:
        - distance_km
        - start_odometer_km
        - end_odometer_km
        - start_soc_pct
        - end_soc_pct
        - start_range_km
        - end_range_km
        - energy_kwh
        - start_position
        - end_position
        - start_place
        - end_place
        - start_address
        - end_address
        - vehicle_reported
        - id
        - detected_at
        - reconstructed
        - start
        - end
        - capacity_kwh
        - capacity_source
      type: object
    TripStats:
      additionalProperties: false
      properties:
        consumption_kwh_per_100km:
          description: "An estimate: the energy over the distance of the trips where both are known and the distance positive, reconstructed ones included. null without such a trip."
          format: double
          type:
            - number
            - "null"
        count:
          description: The trips that started in the period or interval, reconstructed ones included.
          format: int64
          minimum: 0
          type: integer
        distance_km:
          description: The sum of the known distances; 0 without trips.
          format: double
          minimum: 0
          type: number
        distance_unknown:
          description: The trips whose distance is unknown, left out of distance_km.
          format: int64
          minimum: 0
          type: integer
        driving_time_s:
          $ref: "#/components/schemas/Span"
          description: "The sum of the durations of the observed trips: every total their bounds allow lies within [min, max]."
        driving_time_unknown:
          description: "The trips without a duration: the reconstructed ones."
          format: int64
          minimum: 0
          type: integer
        energy_kwh:
          description: The sum of the known energy estimates (ΔSoC × battery capacity).
          format: double
          type: number
        energy_unknown:
          format: int64
          minimum: 0
          type: integer
        reconstructed:
          format: int64
          minimum: 0
          type: integer
      required:
        - count
        - reconstructed
        - distance_km
        - distance_unknown
        - driving_time_s
        - driving_time_unknown
        - energy_kwh
        - energy_unknown
        - consumption_kwh_per_100km
      type: object
    TripsByDistance:
      additionalProperties: false
      properties:
        bands:
          description: "The bands, shortest first: less than 5 km, 5 to 20, 20 to 50, 50 to 100, and 100 km or more."
          items:
            $ref: "#/components/schemas/DistanceBand"
          type: array
        left_out:
          description: "The trips in no band: the reconstructed ones, which may hold several, and those whose distance is unknown."
          format: int64
          minimum: 0
          type: integer
      required:
        - bands
        - left_out
      type: object
    UnpricedCharges:
      additionalProperties: false
      properties:
        charges:
          description: "The charges the place takes whose cost is unknown for want of a price only: part of their window lies before the first version of the tariff. A charge with an entered cost, or without energy_soc_kwh, is not counted: a price would not change it. 0 without the account's currency."
          format: int64
          minimum: 0
          type: integer
        first_day:
          description: "The day, in the place's time zone, when the earliest of them may have started (its start.after): a first version valid from this day gives every one of them a price. null when charges is 0."
          format: date
          type:
            - string
            - "null"
      required:
        - charges
        - first_day
      type: object
    User:
      additionalProperties: false
      properties:
        id:
          type: string
        username:
          description: Lowercase.
          type: string
      required:
        - id
        - username
      type: object
    Variant:
      additionalProperties: false
      properties:
        ac_max_kw:
          description: Power of the standard onboard charger.
          format: double
          type: number
        ac_option_kw:
          description: Power of the optional onboard charger; null when the variant has none.
          format: double
          type:
            - number
            - "null"
        dc_max_kw:
          description: Maximum DC charging power.
          format: double
          type: number
        gross_kwh:
          description: Gross battery capacity.
          format: double
          type: number
        id:
          description: Identifies the variant in the catalog; stable.
          type: string
        name:
          description: A name to display, such as EX30 Single Motor Extended Range.
          type: string
        net_kwh:
          description: Usable battery capacity, which the energy estimates rest on (capacity_source catalog_net); null when no source settles it, and they rest on the vendor's.
          format: double
          type:
            - number
            - "null"
      required:
        - id
        - name
        - gross_kwh
        - net_kwh
        - ac_max_kw
        - ac_option_kw
        - dc_max_kw
      type: object
    VariantList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/VariantOption"
          type: array
      required:
        - items
      type: object
    VariantOption:
      additionalProperties: false
      properties:
        ac_max_kw:
          description: Power of the standard onboard charger.
          format: double
          type: number
        ac_option_kw:
          description: Power of the optional onboard charger; null when the variant has none.
          format: double
          type:
            - number
            - "null"
        candidate:
          description: "The vehicle's details fit the variant, and not every variant of the family: the only candidate is the recognized variant. false for all when the details tell none apart, or fit none."
          type: boolean
        dc_max_kw:
          description: Maximum DC charging power.
          format: double
          type: number
        gross_kwh:
          description: Gross battery capacity.
          format: double
          type: number
        id:
          description: Identifies the variant in the catalog; stable.
          type: string
        levels:
          $ref: "#/components/schemas/FigureLevels"
          description: "Where each figure comes from: manufacturer, published by the maker; secondary, from public sources (press, encyclopedias), cross-checked."
        model_years:
          $ref: "#/components/schemas/ModelYears"
          description: "The model years of the variant, included: two variants of the same name differ by them."
        name:
          description: A name to display, such as EX30 Single Motor Extended Range.
          type: string
        net_kwh:
          description: Usable battery capacity, which the energy estimates rest on (capacity_source catalog_net); null when no source settles it, and they rest on the vendor's.
          format: double
          type:
            - number
            - "null"
      required:
        - model_years
        - candidate
        - levels
        - id
        - name
        - gross_kwh
        - net_kwh
        - ac_max_kw
        - ac_option_kw
        - dc_max_kw
      type: object
    Vehicle:
      additionalProperties: false
      properties:
        collection:
          description: What the collector wrote of the vehicle after its latest pass; null before the first one.
          oneOf:
            - $ref: "#/components/schemas/Collection"
            - type: "null"
        connection:
          $ref: "#/components/schemas/Connection"
          description: The state of the provider connection (Volvo ID) that reads the vehicle.
        id:
          format: uuid
          type: string
        model:
          $ref: "#/components/schemas/Model"
          description: What the vehicle is, from its latest details.
        vin:
          type: string
      required:
        - id
        - vin
        - model
        - connection
        - collection
      type: object
    VehicleList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Vehicle"
          type: array
      required:
        - items
      type: object
    VehicleModelUpdate:
      additionalProperties: false
      properties:
        ac_max_kw:
          description: "The vehicle's onboard charger, one of the variant's in effect after the write (its ac_max_kw or ac_option_kw). null when unknown: the costs take the more powerful."
          exclusiveMinimum: 0
          format: double
          type:
            - number
            - "null"
        variant_id:
          description: "The ID of a variant of the vehicle's family, from GET /vehicles/{vehicle}/variants: it outranks the recognition. null to go back to the recognition."
          minLength: 1
          type:
            - string
            - "null"
      required:
        - variant_id
        - ac_max_kw
      type: object
    VehicleTrip:
      additionalProperties: false
      properties:
        consumption_kwh_per_100km:
          format: double
          type:
            - number
            - "null"
        trip_meter_km:
          format: double
          type:
            - number
            - "null"
      required:
        - trip_meter_km
        - consumption_kwh_per_100km
      type: object
  securitySchemes:
    accessToken:
      description: "A personal access token, `rst_` then 43 characters, issued by `POST /tokens`: it reads only."
      scheme: bearer
      type: http
    session:
      description: The session cookie set by `POST /session`, when the instance is served over plain http.
      in: cookie
      name: runsten_session
      type: apiKey
    sessionSecure:
      description: "The same cookie when the instance is served over https (its redirect URI is https): `Secure`, and the `__Host-` prefix binds it to the host."
      in: cookie
      name: __Host-runsten_session
      type: apiKey
info:
  contact:
    name: Runsten
    url: https://github.com/runsten-app/runsten
  description: |-
    The session, the account's vehicles, their current state (Verdandi), their
    trips and charges (Urd) with the cost of each charge, their statistics, the account's
    settings (its currency, and its places with their tariffs), and the costs entered for
    charges.

    Conventions:

    - Units are in the field names: `_km`, `_m` (metres), `_kwh`, `_pct` (state of charge, in %), `_w`, `_kw`, `_kwh_per_100km`, `_s` (seconds), `_minor` (minor units of the account's currency, as cents: an integer), `price_per_kwh` (major units of the account's currency per kWh).
      Positions are WGS 84, in degrees.
    - Times are RFC 3339, in UTC.
    - An unknown value is `null`, never zero. Every key is always present.
    - Lists are `{"items": [...]}`, never `null`. Trips and charges are paged with an
      opaque cursor, newest first.
    - Errors are `{"error": {"code", "message"}}`: the code is stable, the message is
      for humans and may change. A path under `/api/` that serves no route answers 404
      `not_found`, and a method that a path does not accept answers 405
      `method_not_allowed` with an `Allow` header.
    - Every response carries `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`
      and `Referrer-Policy: no-referrer`.

    Every route but `POST /session` requires the session cookie it sets, or, to read, a
    personal access token (`Authorization: Bearer rst_…`, issued by `POST /tokens`). A token only
    reads: it serves the `GET` routes but those of the session and of the tokens (403
    `insufficient_scope` otherwise), at most 120 requests at once then 2 per second (429
    `rate_limited`, with `Retry-After`). Requests that
    change state (`POST`, `PUT`, `DELETE`) from another origin are refused (403
    `cross_origin`), after the `Sec-Fetch-Site` or `Origin` header. A request body must be
    `application/json` (415 `unsupported_media_type` otherwise).
  license:
    identifier: AGPL-3.0-or-later
    name: AGPL-3.0-or-later
  title: Runsten API
  version: 1.0.0
openapi: 3.1.0
paths:
  /account/export:
    get:
      description: "Every row the account holds, raw snapshots included, as one JSON document, read from one snapshot of the database and written as it is read: a failure midway cuts it short, and it is then no valid JSON. Secrets are left out. Open to every account, whatever its offer."
      operationId: exportAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
          description: The export, as an attachment (Content-Disposition), named after the day.
          headers:
            Content-Disposition:
              description: attachment, with a file name such as runsten-account-2026-10-01.json.
              required: true
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: Export all the account's data
      tags:
        - account
  /charge-costs/orphans:
    get:
      description: "After a rebuild of the derived data changed the charges, an entered cost whose charge is neither at the same detection time nor the only one overlapping its window: never lost, never attached by guess. Attach each to a charge, or delete it. They count in no cost total: the statistics show them apart. Newest first, by `window.after`."
      operationId: listOrphanedCosts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanList"
          description: Every orphaned cost of the account.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`feature_unavailable`: the account's offer does not include this function (`limits.unavailable` of the session)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The entered costs no charge takes
      tags:
        - costs
  /charge-costs/orphans/{id}:
    delete:
      description: An orphaned one most often; one that a charge takes is deleted too.
      operationId: deleteOrphanedCost
      parameters:
        - description: The entered cost's ID.
          in: path
          name: id
          required: true
          schema:
            description: The entered cost's ID.
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`cross_origin`: a request that changes state, from another origin. `feature_unavailable`: the account's offer does not include this function (`limits.unavailable` of the session). `insufficient_scope`: an access token only reads; this operation requires a session."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such entered cost in the account."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: Delete an entered cost
      tags:
        - costs
  /charge-costs/orphans/{id}/charge:
    put:
      description: "The charge, of any vehicle of the account, takes the cost: it gets the charge's detection time and window. An entered cost that a charge takes can be moved too."
      operationId: attachOrphanedCost
      parameters:
        - description: The entered cost's ID.
          in: path
          name: id
          required: true
          schema:
            description: The entered cost's ID.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attach"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
          description: The charge, with the cost.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_body`: not a single JSON object of the schema, a value out of its bounds, an unknown field, or more than 1 MiB; the message names the field, never its value."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`cross_origin`: a request that changes state, from another origin. `feature_unavailable`: the account's offer does not include this function (`limits.unavailable` of the session). `insufficient_scope`: an access token only reads; this operation requires a session."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such entered cost in the account, or no such vehicle or charge."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`charge_has_cost`: the charge already takes another entered cost; delete that one first."
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unsupported_media_type`: the body is not `application/json`."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: Attach an entered cost to a charge
      tags:
        - costs
  /connection:
    get:
      description: Whether a Volvo ID is connected, and the application key its vehicles are read with.
      operationId: getConnection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSettings"
          description: The connection.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The account's connection to Volvo
      tags:
        - connection
  /connection/api-key:
    delete:
      description: "The vehicles are no longer read until another key is given. On an instance with a key of its own, it only removes a key left from before: the instance's reads every vehicle."
      operationId: deleteAPIKey
      responses:
        "204":
          description: Removed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`cross_origin`: a request that changes state, from another origin. `insufficient_scope`: an access token only reads; this operation requires a session."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: Remove the account's application key
      tags:
        - connection
    put:
      description: "Only on an instance without a key of its own (`instance_key` false). Volvo counts its quota of calls on the application of the key: with the account's own, its vehicles spend their own quota. With a Volvo ID connected, the vehicles are listed with the key first: a key Volvo refuses is not stored, one it accepts records them, unless they are more than the instance lets an account have. The tokens are left alone: no new consent."
      operationId: putAPIKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSettings"
          description: The connection.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_body`: not a single JSON object of the schema, a value out of its bounds, an unknown field, or more than 1 MiB; the message names the field, never its value. `api_key_refused`: Volvo refused the key."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`cross_origin`: a request that changes state, from another origin. `insufficient_scope`: an access token only reads; this operation requires a session."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`instance_key`: the instance has a key of its own, which reads every vehicle. `too_many_vehicles`: the Volvo ID gives access to more vehicles than the instance lets an account have; the key is not stored."
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unsupported_media_type`: the body is not `application/json`."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: Give the account's application key
      tags:
        - connection
  /mqtt:
    delete:
      description: The collector disconnects from it, at its next pass, and publishes nothing more. The retained messages stay on the broker.
      operationId: deleteMQTT
      responses:
        "204":
          description: Removed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`cross_origin`: a request that changes state, from another origin. `insufficient_scope`: this operation requires a session, never an access token."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: Remove the account's MQTT broker
      tags:
        - mqtt
    get:
      description: The broker the collector publishes the vehicles' state to, without its password, and the collector's connection to it.
      operationId: getMQTT
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSettings"
          description: The broker.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`insufficient_scope`: this operation requires a session, never an access token."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
      summary: The account's MQTT broker
      tags:
        - mqtt
    put:
      description: The collector connects to it again with this configuration, at its next pass. What it wrote of the previous connection goes.
      operationId: putMQTT
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MqttBrokerUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSettings"
          description: The broker.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
