  /vehicles/{vehicle}/stats:
    get:
      description: "Totals of the trips, charges and parked intervals of the period, and, with `bucket`, the same figures by day, week or month. An event counts once, in the interval that holds its `start.after`: unlike the lists, which keep the events that may overlap the period, an event across a limit counts only where it started. A sum covers the known values, and its `_unknown` companion counts the events that lacked one; a sum over no event is 0, an average `null`. Energies, consumption, costs and the loss of the state of charge are estimates. At most 400 intervals."
      operationId: getVehicleStats
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
        - description: The start of the period [from, to). Without it, the period starts with the vehicle's first event.
          explode: false
          in: query
          name: from
          schema:
            description: The start of the period [from, to). Without it, the period starts with the vehicle's first event.
            examples:
              - "2026-09-01T00:00:00+02:00"
            format: date-time
            type: string
        - description: The end of the period, excluded; it must come after from. Without it, now.
          explode: false
          in: query
          name: to
          schema:
            description: The end of the period, excluded; it must come after from. Without it, now.
            examples:
              - "2026-10-01T00:00:00+02:00"
            format: date-time
            type: string
        - description: The IANA time zone in which days, weeks and months are split, changes of daylight saving time included.
          explode: false
          in: query
          name: tz
          schema:
            default: UTC
            description: The IANA time zone in which days, weeks and months are split, changes of daylight saving time included.
            examples:
              - Europe/Paris
            type: string
        - description: "Splits the period into intervals: days, ISO weeks (from Monday) or months. Without it, the totals only."
          explode: false
          in: query
          name: bucket
          schema:
            description: "Splits the period into intervals: days, ISO weeks (from Monday) or months. Without it, the totals only."
            enum:
              - day
              - week
              - month
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
          description: The statistics.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_parameter`: `from`, `to`, `tz` or `bucket`, or more than 400 intervals; the message names the parameter."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`feature_unavailable`: `bucket`, while the account's offer leaves out the statistics (`limits.unavailable` of the session)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account. Another account's vehicle is not found either."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The statistics of a vehicle over a period
      tags:
        - stats
  /vehicles/{vehicle}/trips:
    get:
      description: Newest first, by `start.after` then `detected_at`. Figures are `null` when the readings do not give them.
      operationId: listTrips
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
        - description: "Keeps the events that may have happened, at least partly, at or after this time: those with end.before after it. An event whose bounds straddle it is kept."
          explode: false
          in: query
          name: from
          schema:
            description: "Keeps the events that may have happened, at least partly, at or after this time: those with end.before after it. An event whose bounds straddle it is kept."
            examples:
              - "2026-09-28T00:00:00Z"
            format: date-time
            type: string
        - description: "Keeps the events that may have happened, at least partly, before this time: those with start.after before it. With from, it must come after from."
          explode: false
          in: query
          name: to
          schema:
            description: "Keeps the events that may have happened, at least partly, before this time: those with start.after before it. With from, it must come after from."
            examples:
              - "2026-09-29T00:00:00Z"
            format: date-time
            type: string
        - description: The next_cursor of the previous page. It stays valid when from or to change.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page. It stays valid when from or to change.
            type: string
        - description: The maximum number of events of the page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: The maximum number of events of the page.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTrip"
          description: A page of trips, newest first.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_parameter`: `from`, `to`, `limit` or `cursor`; the message names the parameter."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account. Another account's vehicle is not found either."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The trips of a vehicle (Urd)
      tags:
        - events
  /vehicles/{vehicle}/trips.csv:
    get:
      description: "Every event of the period the list would give, as a CSV file (RFC 4180, UTF-8, a header row) for a spreadsheet: oldest first, one row per event, its fields flattened and named after the JSON ones (`start_after` is `start.after`). Times are RFC 3339 in UTC, numbers have a decimal point, an unknown value is an empty cell. A text that would begin with `=`, `+`, `-` or `@` is prefixed with `'`, so that no spreadsheet takes it for a formula."
      operationId: tripsCSV
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
        - description: Keeps the events that may have happened, at least partly, at or after this time, as the lists do.
          explode: false
          in: query
          name: from
          schema:
            description: Keeps the events that may have happened, at least partly, at or after this time, as the lists do.
            examples:
              - "2026-09-01T00:00:00Z"
            format: date-time
            type: string
        - description: Keeps the events that may have happened, at least partly, before this time. With from, it must come after from.
          explode: false
          in: query
          name: to
          schema:
            description: Keeps the events that may have happened, at least partly, before this time. With from, it must come after from.
            examples:
              - "2026-10-01T00:00:00Z"
            format: date-time
            type: string
      responses:
        "200":
          content:
            text/csv:
              schema:
                description: The header row, then a row per event.
                type: string
          description: The CSV file, as an attachment (Content-Disposition), named after the day.
          headers:
            Content-Disposition:
              description: attachment, with a file name such as runsten-trips-2026-10-01.csv.
              required: true
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_parameter`: `from` or `to`; the message names the parameter."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`feature_unavailable`: the account's offer does not include this function (`limits.unavailable` of the session)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account. Another account's vehicle is not found either."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The trips of a vehicle, as CSV
      tags:
        - events
  /vehicles/{vehicle}/trips/{id}:
    get:
      description: The same object as the item of the list.
      operationId: getTrip
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
        - description: The event ID. Any RFC 3339 form of the detection time is accepted too, such as 2026-09-28T07:01:00Z.
          in: path
          name: id
          required: true
          schema:
            description: The event ID. Any RFC 3339 form of the detection time is accepted too, such as 2026-09-28T07:01:00Z.
            examples:
              - "2026-09-28T07:01:00.000000Z"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
          description: The trip.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account, or no such event for it."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: A trip
      tags:
        - events
  /vehicles/{vehicle}/variants:
    get:
      description: "The variants of the catalog of the family the vehicle reports: the candidates of the recognition first, then the rest of the family, whatever the model years. Empty until the details are read, for a family the catalog does not have, and for a vehicle that is not battery electric."
      operationId: listVariants
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
          description: The variants, candidates first.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account. Another account's vehicle is not found either."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The variants a vehicle may be
      tags:
        - vehicles
servers:
  - url: /api/v1
tags:
  - description: Sign in and out.
    name: session
  - description: The account's vehicles, their model and their provider connection.
    name: vehicles
  - description: Trips and charges, derived from the recorded readings.
    name: events
  - description: Totals of the trips and charges of a period, by day, week or month.
    name: stats
  - description: The estimated battery capacity of a vehicle, and how it changed.
    name: battery
  - description: The account's currency, and its places with their dated tariffs.
    name: settings
  - description: The costs entered for charges, and those no charge takes.
    name: costs
  - description: "The account's connection to Volvo: its Volvo ID, and the application key its vehicles are read with."
    name: connection
  - description: "The account itself: the export of all its data."
    name: account
  - description: The user's personal access tokens, with which a program reads the API without a session.
    name: tokens
  - description: The account's MQTT broker, which the collector publishes the vehicles' state to.
    name: mqtt
