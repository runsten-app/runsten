      description: "Over the whole history of the vehicle, one capacity estimate per source and charge and their aggregates: no period is chosen. A power estimate is the integral of the charging power over the charge's retained span, over the SoC change of the same readings; a billed one is the energy entered from the charge's receipt, over the SoC change of the whole charge. Neither is a measurement: the vehicle exposes no energy meter, and the integer SoC rounds a 20-point span by ±5 %. `current` is the median of the latest 20 estimates, all sources together; `deviation_pct` compares it with the reference capacity, signed and never clamped, so that a bias of the method shows as one instead of passing for a new battery. `change` waits for 12 months of history and twice 20 estimates: a ratio of two medians of the same method, in which a constant bias cancels, and the trend says more than the level. `cycles` is an estimate too, and `excluded` counts the candidates the filters set aside, by reason, so that the reader sees why there are few points. `range_at_full` is the vehicle's own forecast of its consumption, which follows the season and the driving: shown apart, and never a measure of the battery. The months are split in the requested time zone, empty ones included; at most 400 of them."
      operationId: getVehicleBattery
      parameters:
        - description: The vehicle ID.
          in: path
          name: vehicle
          required: true
          schema:
            description: The vehicle ID.
            type: string
        - description: The IANA time zone in which the months are split, changes of daylight saving time included.
          explode: false
          in: query
          name: tz
          schema:
            default: UTC
            description: The IANA time zone in which the months are split, changes of daylight saving time included.
            examples:
              - Europe/Paris
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battery"
          description: The battery capacity trend.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`invalid_parameter`: `tz`, or more than 400 months of history; the message names the parameter."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no valid session, or an invalid or expired access token (with a `WWW-Authenticate` header)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: no such vehicle in the account. Another account's vehicle is not found either."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: too many requests with this access token."
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              required: true
              schema:
                minimum: 1
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`internal`: an internal failure, without detail; the cause is logged."
      security:
        - session: []
        - sessionSecure: []
        - accessToken: []
      summary: The estimated battery capacity of a vehicle
      tags:
        - battery
