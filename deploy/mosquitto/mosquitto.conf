# Mosquitto for development and tests (compose.yaml's mqtt profile, tilt up): a broker
# to publish to without Home Assistant. Anonymous and in plain text: it is reached only
# from the host's loopback and the stack's network. Never for a real broker.
listener 1883
allow_anonymous true
# Nothing written to disk: the retained messages go with the container, and Runsten
# publishes them again when it connects.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
