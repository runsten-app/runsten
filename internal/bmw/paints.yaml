# BMW's and MINI's paints by the code CarData gives in basicData's colourCode (C4P), named as
# BMW names them in English: the paints of the electric models in the catalog.
#
# - brand: the catalog's, bmw or mini: the same code may name two paints at BMW and at MINI.
# - code: BMW's option code, three letters or digits, quoted when it is a number.
# - name: as BMW's English documents print it. They write the standard metallic paints
#   without "metallic" (Black Sapphire) and BMW Individual's and the Frozen paints with it,
#   and this table keeps that. A paint offered as "M Brooklyn Grey" with the M Sport package
#   keeps its own name; M Portimao Blue has no other.
# - sources: every entry is backed by at least one; manufacturer for BMW's own documents
#   (price lists, specification guides, catalogues of a market, or a dealer's copy of one),
#   secondary for anything else. Only the code and its name are taken from them. An entry with
#   one source says so in a comment.
#
# BMW publishes no table of its codes: these are the price lists' and catalogues' of the
# markets, 2022 to 2026. A paint may have two codes (Frozen Pure Grey: X1F on the i4, C5A on
# the others); both are listed. Left out: the i7's two-tone paints (3MY, SXB…), option codes of
# a combination, and the iX3 (NA5)'s paints whose English name no source prints yet (C7T, C7U,
# C7V: Polarized, Ocean Wave and Eucalyptus in the German list), and 490, BMW Individual's code
# for a paint made to order, which names none. A code not here is shown as it is.

# --- BMW ----------------------------------------------------------------------------------

