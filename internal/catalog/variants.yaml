# --- Škoda Enyaq, Enyaq Coupé and Elroq (MEB) ----------------------------------------------
#
# MyŠkoda's API reads no battery capacity, so capacity does not separate these variants (see
# readsCapacity): Škoda is exempted like Tesla, no ambiguous_with.
# family: the model name as MyŠkoda returns it for a car its owner did not rename: "Enyaq",
# "Elroq". The Coupé is believed to be reported as "Enyaq Coupé" (not verified on a real
# reading): if it turns out to be "Enyaq", merge the Coupé entries into the Enyaq ones.
# Škoda renamed Enyaq iV to Enyaq with MY2024 and the family stays "Enyaq".
# Škoda's technical-data PDFs are updated in place at the same URL: the 2027 ones are the
# April 2026 editions, the 2025 ones the May 2025 editions.
# MY2027 (mid-2026) arrived for the Enyaq, the Enyaq Coupé and the Elroq: Škoda's Finnish
# technical data "Enyaq & Enyaq Coupé vm. 2027" (April 2026) covers both body styles with the
# same capacities and DC powers (60: 61 (58) kWh, 105 kW; 85, 85x and RS: 82 (77) kWh, 165 kW).

# Conflict (dc_max_kw): Škoda's 2021 charging sheet gives 50 kW DC for the 50 (100 kW
# not available), Wikipedia says 50 kW, 100 kW optional: the highest is kept. Last model
# year of the 50 not sourced (2023 is a guess).
