# --- BMW i3 and i3s (I01) -------------------------------------------------------------
#
# BMW's ConnectedDrive names the car "i3" or "i3 (+ REX)" (bimmer_connected's fixtures, not
# CarData's): its family is i3 either way. The i3s's name is assumed to begin with "i3s",
# a family of its own; a car read "i3" shares the batteries of the i3s anyway. The range
# extender (REx, a 9 l petrol engine) keeps the battery and the chargers of its BEV
# (ADAC), and is one variant with it. Assumption: CarData tells the REx's driveTrain BEV,
# as ConnectedDrive's ELECTRIC_WITH_RANGE_EXTENDER; read otherwise, it has no variant.
# Model years: BMW's change in July, so the 94 Ah built from July 2016 is a 2017 and the
# 120 Ah built from November 2018 a 2019; the years of two packs overlap where the
# production switched, told apart by the capacity. DC: ev-database 47 or 49 kW,
