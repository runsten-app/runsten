# Electric and plug-in hybrid variants of Volvo, Polestar and Tesla vehicles.
#
# One entry per variant: a powertrain and battery over a range of model years. Its id is
# stored by users once they choose it, so it never changes: correcting a figure keeps the
# id, and an entry is corrected rather than removed.
#
# - family: exactly what the Volvo API returns in descriptions.model. Polestar families are
#   provisional: no data source returns them yet. Tesla's: car_type as the Owner API's
#   normalizer names it (Model 3, Model Y).
# - trims: values of a vendor's trim badge (Tesla's trim_badging), lower case, sourced as
#   a figure: like the motor codes, they only rule out the variants that list others.
# - years: [from, to] model years, or [from] while the variant is on sale.
# - powertrain: plugin_hybrid for a plug-in hybrid, recognized only for a vehicle read as
#   one; electric when left out.
# - gross_kwh, net_kwh: battery capacity; net_kwh is left out when no source settles it.
# - ac_max_kw: standard onboard charger; ac_option_kw: the optional one (22 kW), if any.
# - dc_max_kw: maximum DC power; left out of a plug-in hybrid without DC charging.
# - api_kwh: values of batteryCapacityKWH seen for the variant, each with where it was seen.
# - motor_codes: VIN positions 6-7, from unofficial tables: they only break ties.
# - sources: every figure is backed by at least one source, listed in its "for"; its level
#   says whether the figure comes from the manufacturer or from a secondary source (press,
#   Wikipedia, ev-database as a cross-check).
#
# Conflicts between sources: a maximum power keeps the highest value (it never narrows a
# cost interval by mistake); a capacity keeps the manufacturer's, or else the most cited,
# or is left out on a tie. Each conflict is told in a comment.
#
# Variants that no reading can separate (same family, overlapping years, capacities within
# the tolerances, no motor code apart) must name each other in ambiguous_with: Match then
# offers both, and the user chooses. Tesla's are exempt: the Owner API tells no capacity,
# ambiguity is the rule there.

