# --- Plug-in hybrids: BMW and Mini -------------------------------------------------------
#
# Recognized only for a car CarData reads as a plug-in hybrid (driveTrain or
# propulsionType PHEV, as ConnectedDrive's PLUGIN_HYBRID). The family is the first word of
# the model's name, assumed as ConnectedDrive writes it ("X3 xDrive30e", bimmer_connected's
# fixtures): X1, X2, X3, X5, XM and i8 for the X models and the i8, the model's number for
# the Series (330e, 530e, 740Le: each its own family), and Countryman for the Mini, whose
# name might rather begin with "Cooper" (Cooper SE Countryman ALL4). No source read gives
# CarData's names of these cars. BMW's press kits give wallbox times rather than the
# onboard charger: most chargers are ADAC's catalogue's, the top of its range ("AC:2,3-3,7"
# is 3.7 kW). Gross capacities are BMW's where its newsroom tells them; ADAC's catalogue
# labels some net capacities gross (the i8's 5.2 and 9.1), Wikipedia's are kept there.
# Model years change in July, as the electric ones'. No DC charging.

