# --- Plug-in hybrids: Volvo SPA and CMA, Polestar 1 -------------------------------------
#
# Recognized only for a vehicle read as a plug-in hybrid (Volvo's fuelType PETROL/ELECTRIC),
# never confused with an electric variant. The gross capacities are those of Volvo's
# manuals, model year by model year ("Total amount of energy"; a manual of week 46 of a
# year is the next model year's, one of week 17 or 22 often already too). The 11.6 kWh
# pack gave way to the 18.8 kWh one during model year 2022, at a date of each family's
# (an XC60 of MY2022 reports 11.832): the two overlap, told apart by the capacity. T6, T8
# and T8 Polestar Engineered share their pack. No DC charging. Up to MY2022 the manuals
# charge at 230 V and 16 A at most, single phase: 3.7 kW; the 18.8 kWh pack's give 3.6
# kW at most in MY2022, today's 6.4 kW (16 A, two or three phases) for every model year:
# the highest is kept. No source settles the net capacity of the 9.2 and 11.6 kWh packs.
# No motor code is known.

# 230 V at up to 16 A, single phase, in the manual: 3.7 kW.
